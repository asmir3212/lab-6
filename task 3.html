<!DOCTYPE html>
<html>
<head>
<title>Hotel Reservation Form</title>
</head>
<body bgcolor="lightgray">
<h2 align="center"><font color="red">Continental Hotel Reservation Form</font></h2>
<form>
<table border="2" cellpadding="5" cellspacing="0" align="center" bgcolor="lightblue" width="600">
<tr>
<td align="right" bgcolor="skyblue" width="30%"><b>Name</b></td>
<td bgcolor="white" width="70%"><input type="text" placeholder="Enter your name" size="40"></td>
</tr>
<tr>
<td align="right" bgcolor="skyblue"><b>eMail</b></td>
<td bgcolor="white"><input type="text" value="info@continental.pk" size="40"></td>
</tr>
<tr>
<td align="right" bgcolor="skyblue"><b>Mobile No</b></td>
<td bgcolor="white"><input type="text" placeholder="Enter your cell number" size="40"></td>
</tr>
<tr>
<td align="right" bgcolor="skyblue"><b>Arrival Time</b></td>
<td bgcolor="white"><input type="text" placeholder="Enter your arrival time" size="40"></td>
</tr>
<tr>
<td align="right" bgcolor="skyblue"><b>Departure</b></td>
<td bgcolor="white"><input type="text" size="18"> <input type="text" size="18"></td>
</tr>
<tr>
<td align="right" bgcolor="skyblue"><b>Room Type</b></td>
<td bgcolor="white"><input type="radio" name="room"> Single <input type="radio" name="room"> Double<br><input type="radio" name="room"> Presidential Suite</td>
</tr>
<tr>
<td align="right" bgcolor="skyblue"><b>Preferences</b></td>
<td bgcolor="white"><input type="checkbox"> Non-Smoking<br><input type="checkbox"> Internet<br><input type="checkbox"> Firm Mattress</td>
</tr>
<tr>
<td align="right" bgcolor="skyblue"><b>Mode of Payment</b></td>
<td bgcolor="white"><input type="checkbox"> Cash <input type="checkbox"> Check<br><input type="checkbox"> Credit Card <select><option>Select Card</option></select></td>
</tr>
<tr>
<td colspan="2" align="center" bgcolor="skyblue"><input type="submit" value="Send Data"></td>
</tr>
</table>
</form>
</body>
</html>
